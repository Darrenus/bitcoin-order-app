name: "sast-scan"

on:
  push:
    branches: [githubcicd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.x
          cache: npm

      - name: Restore Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: dependency-check-${{ runner.os }}-12.1.1-v1

      - name: Download OWASP Dependency-Check
        run: |
          wget --quiet https://github.com/dependency-check/DependencyCheck/releases/download/v12.1.1/dependency-check-12.1.1-release.zip
          unzip -q dependency-check-12.1.1-release.zip -d "$HOME/dependency-check"

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.WORKSHOP6_NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "WORKSHOP6_NVD_API_KEY must be configured as an Actions secret." >&2
            exit 1
          fi
          chmod +x "$HOME/dependency-check/dependency-check/bin/dependency-check.sh"
          "$HOME/dependency-check/dependency-check/bin/dependency-check.sh" \
            --project "bitcoin" \
            --nvdApiKey "$NVD_API_KEY" \
            --format HTML \
            --out . \
            --scan . \
            --exclude "**/node_modules/**" \
            --nvdValidForHours 24 \
            --disableOssIndex

      - name: Archive SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: ./dependency-check-report.html
          if-no-files-found: error
